name: votingapp CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
env:
  IMAGE_TAG: ${{ github.sha }}


jobs:
  vote-ci:
    name: vote - Python CI
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: set up code
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip' # caching pip dependencies
      - run: pip install -r vote/requirements.txt

  result-ci:
    name: Result - Node.js CI
    runs-on: ubuntu-latest
    needs: vote-ci

    steps:
      - name: checkout code
        uses: actions/checkout@v7
      - name: set up code  
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false # Disable automatic npm caching if not required
      - run: |
          npm ci result/package.json
          npm test result/package.json


  worker-ci:
    name: worker-.NET CI
    runs-on: ubuntu-latest
    needs: result-ci

    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: set up code  
        uses: actions/setup-dotnet@v6
        with:
          concurrency: 
          dotnet-version: '7.0.x'

      - name: Restore dependencies
        run: dotnet restore worker/Worker.csproj

      - name: Build Worker
        run: dotnet build worker/Worker.csproj --no-restore
      

  gitleaks-scan:

    runs-on: ubuntu-latest
    needs: worker-ci

    steps:
      - name: checkout code  
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run Gitleaks scan
        uses: gitleaks/gitleaks-action@v3
        env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
  trivy_fs_scan:
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'


  sonarqube-scan:

    runs-on: self-hosted
    needs: trivy_fs_scan
    steps:
      - name: Checking out
        uses: actions/checkout@master
        with:
          # Disabling shallow clone is recommended for improving relevancy of reporting
          fetch-depth: 0
      - name: SonarQube Scan
        uses: kitabisa/sonarqube-action@v1.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}


      - name: SonarQube Quality Gate check
        id: sonarqube-quality-gate-check
        uses: sonarsource/sonarqube-quality-gate-action@master
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  build_docker_image_and_push:

    runs-on: self-hosted
    needs: sonarqube-scan
    steps:

      - name: Checkout
        uses: actions/checkout@v6
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
    
      - name: Build Vote image
        run: |
          docker build \
            -t ${{ vars.DOCKERHUB_USERNAME }}/voting-vote:${{ github.sha }} \
            ./vote

      - name: Build Result image
        run: |
          docker build \
            -t ${{ vars.DOCKERHUB_USERNAME }}/voting-result:${{ github.sha }} \
            ./result

      - name: Build Worker image
        run: |
          docker build \
            -t ${{ vars.DOCKERHUB_USERNAME }}/voting-worker:${{ github.sha }} \
            ./worker

      - name: Push Vote image
        run: |
          docker push \
            ${{ vars.DOCKERHUB_USERNAME }}/voting-vote:${{ github.sha }}

      - name: Push Result image
        run: |
          docker push \
            ${{ vars.DOCKERHUB_USERNAME }}/voting-result:${{ github.sha }}

      - name: Push Worker image
        run: |
          docker push \
            ${{ vars.DOCKERHUB_USERNAME }}/voting-worker:${{ github.sha }}


  trivy_image_scan:
  
    runs-on: self-hosted
    needs: build_docker_image_and_push
    steps:
      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: push356/vote-img:${{ github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Verify AWS credentials
        run: |
          aws --version
          aws sts get-caller-identity
