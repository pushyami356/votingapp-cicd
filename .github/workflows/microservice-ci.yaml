name: Microservice CI

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string

jobs:
  compile:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/microservices-demo/${{ inputs.service }}:sha-${{ github.sha }}

    steps:
      # -------------------
      # Checkout source
      # -------------------
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up dotnet 7
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '7'
          cache: true  
      - name: Build with dotnet
        run: dotnet build 

      - name: Gitleaks Installation
        run: sudo apt install gitleaks -y
      - name: Gitleaks Code Scan
        run: gitleaks detect source . -r gitleaks-report.json -f json 
        
  test:
     runs-on: ubuntu-latest
     needs: compile
     steps:
     - uses: actions/checkout@v7
     - name: Set up dotnet 7
       uses: actions/setup-dotnet@v6
       with:
         dotnet-version: '7'
         cache: true
     - name: Unit Test Cases
       run: dotnet test --no-build --configuration Release

  build_project:
  runs-on: ubuntu-latest
  needs: test

  steps:
    - uses: actions/checkout@v6

    - name: Set up .NET 7
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '7'
        cache: true

    - name: Build Project
      run: dotnet build --configuration Release

    - name: Publish Project
      run: dotnet publish --configuration Release --output ./publish

    - name: Upload .NET artifact
      uses: actions/upload-artifact@v6
      with:
        name: worker
        path: ./publish/**

      # -------------------
      # Docker Buildx (cache support)
      # -------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -------------------
      # Login to GHCR
      # -------------------
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------------------
      # Build Docker image (cached)
      # -------------------
      - name: Build Image
        run: |
          docker build \
            --cache-from=type=gha \
            --cache-to=type=gha,mode=max \
            -t $IMAGE_NAME \
            ./src/${{ inputs.service }}
  
             
          

      # -------------------
      # Security Scan (before push)
      # -------------------
      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}
          severity: HIGH,CRITICAL
          exit-code: 0
          vuln-type: os,library

      # -------------------
      # Push image (only if scan passes)
      # -------------------
      - name: Push Image
        run: |
          docker push $IMAGE_NAME

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with: 
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1
        
      - name: Verify AWS credentials
        run: |
          aws --version
          aws sts get-caller-identity    
