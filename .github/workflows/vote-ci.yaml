name: vote CI
on: 
  push:
    branches: [ main ]

permissions:
  contents: read
env:
  IMAGE_TAG: ${{ github.sha }}


jobs: 
compile:
  runs-on: self-hosted

  steps:
    - name: checkout code
      uses: actions/checkout@v7
      
    - name: set up code
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: 'pip' # caching pip dependencies 
    - run: pip install -r vote/requirements.txt


gitleaks-scan:

  runs-on: self-hosted
  needs: compile

  steps:
    - name: checkout code
      uses: actions/checkout@v6
    - name: set up code
      uses: gitleaks/gitleaks-action@v3
    - name: gitleak scan
      run:
        gitleaks detect --source ./vote --exit-code 1

trivy_fs_scan:
  runs-on: ubuntu-latest
  needs: gitleaks-scan
  steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: 'fs'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'
   

sonarqube-scan:
    
  runs-on: self-hosted
  needs: trivy_fs_scan
  steps:
    - name: Checking out
      uses: actions/checkout@master
      with:
        # Disabling shallow clone is recommended for improving relevancy of reporting
        fetch-depth: 0
    - name: SonarQube Scan
      uses: kitabisa/sonarqube-action@v1.2.0
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

          
    - name: SonarQube Quality Gate check
      id: sonarqube-quality-gate-check
      uses: sonarsource/sonarqube-quality-gate-action@master
      with:
        pollingTimeoutSec: 600
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }} 

build_docker_image_and_push:
  
  runs-on: self-hosted
  needs: sonarqube-scan
  steps:
      
    - name: Checkout
      uses: actions/checkout@v6
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    
    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: ./vote
        file: ./vote/Dockerfile
        push: true
        tags: |
          push356/vote-img:${{ github.sha }}
          push356/vote-img:latest

trivy_image_scan:
  
  runs-on: self-hosted
  needs: build_docker_image_and_push
  steps:
    - name: Run Trivy image scan
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: image
        image-ref: push356/vote-img:${{ github.sha }}
          
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v5
      with: 
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
        
    - name: Verify AWS credentials
      run: |
        aws --version
        aws sts get-caller-identity
    
