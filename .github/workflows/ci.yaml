name: Microservice CI

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      SONAR_TOKEN:
        required: true
      SONAR_HOST_URL:
        required: true

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        if: inputs.service == 'vote'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Vote
        if: inputs.service == 'vote'
        working-directory: vote
        run: pip install -r requirements.txt

      - name: Setup .NET
        if: inputs.service == 'worker'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build Worker
        if: inputs.service == 'worker'
        working-directory: worker
        run: |
          dotnet restore
          dotnet build

      - name: Setup Node
        if: inputs.service == 'result'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Result
        if: inputs.service == 'result'
        working-directory: result
        run: |
          npm ci
          npm run build --if-present
          npm test || echo "No tests configured"

  gitleaks:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Gitleaks
        run: |
          curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/install.sh | sh -s -- -b /usr/local/bin
          gitleaks detect --source . --exit-code 1

  sonar:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: SonarQube
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  trivy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"

  docker:
    needs:
      - build
      - gitleaks
      - sonar
      - trivy

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Build
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/example-voting-app-${{ inputs.service }}:${{ github.sha }} ./${{ inputs.service }}

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/example-voting-app-${{ inputs.service }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Docker Push
        if: github.event_name == 'push'
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/example-voting-app-${{ inputs.service }}:${{ github.sha }}
