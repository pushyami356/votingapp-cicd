name: Microservice CI

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:

  # -------------------
  # Compile + Gitleaks
  # -------------------
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up .NET 7
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '7'
          cache: true

      - name: Restore dependencies
        run: dotnet restore ./src/${{ inputs.service }}

      - name: Build with .NET
        run: dotnet build ./src/${{ inputs.service }} --configuration Release --no-restore

      - name: Install Gitleaks
        run: sudo apt-get update && sudo apt-get install -y gitleaks

      - name: Gitleaks Code Scan
        run: |
          gitleaks detect \
            --source . \
            --report-format json \
            --report-path gitleaks-report.json \
            --exit-code 1

  # -------------------
  # Unit Tests
  # -------------------
  test:
    runs-on: ubuntu-latest
    needs: compile

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up .NET 7
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '7'
          cache: true

      - name: Restore dependencies
        run: dotnet restore ./src/${{ inputs.service }}

      - name: Unit Test Cases
        run: dotnet test ./src/${{ inputs.service }} --configuration Release

  # -------------------
  # Docker Build + Scan + Push
  # -------------------
  docker:
    runs-on: ubuntu-latest
    needs: test

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/microservices-demo/${{ inputs.service }}:sha-${{ github.sha }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v7

      # -------------------
      # Docker Buildx
      # -------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -------------------
      # Login to GHCR
      # -------------------
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------------------
      # Build Docker image
      # -------------------
      - name: Build Image
        run: |
          docker build \
            --cache-from=type=gha \
            --cache-to=type=gha,mode=max \
            -t $IMAGE_NAME \
            ./src/${{ inputs.service }}

      # -------------------
      # Trivy Image Scan
      # -------------------
      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}
          severity: HIGH,CRITICAL
          exit-code: 1
          vuln-type: os,library

      # -------------------
      # Push image
      # -------------------
      - name: Push Image
        run: |
          docker push $IMAGE_NAME
          
