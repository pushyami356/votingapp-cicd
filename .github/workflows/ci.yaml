name: Microservice CI

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string

    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      SONAR_TOKEN:
        required: true
      SONAR_HOST_URL:
        required: true

jobs:

  build:
    name: Build ${{ inputs.service }}
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # Vote - Python
      - name: Setup Python
        if: inputs.service == 'vote'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Vote
        if: inputs.service == 'vote'
        working-directory: vote
        run: |
          pip install -r requirements.txt

      # Worker - .NET
      - name: Setup .NET
        if: inputs.service == 'worker'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build Worker
        if: inputs.service == 'worker'
        working-directory: worker
        run: |
          dotnet restore
          dotnet build

      # Result - Node.js
      - name: Setup Node.js
        if: inputs.service == 'result'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Result
        if: inputs.service == 'result'
        working-directory: result
        run: |
          npm ci
          npm run build --if-present
          npm test || echo "No tests configured"


  # Gitleaks
  gitleaks:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gitleaks
        run: |
          gitleaks detect --source . --exit-code 1


  # SonarQube
  sonar:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


  # Trivy
  trivy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"


  # Docker
  docker:
    needs:
      - build
      - gitleaks
      - sonar
      - trivy

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Build
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/example-voting-app-${{ inputs.service }}:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/example-voting-app-${{ inputs.service }}:latest \
            ./${{ inputs.service }}

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/example-voting-app-${{ inputs.service }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Docker Push
        if: github.event_name == 'push'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/example-voting-app-${{ inputs.service }}:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/example-voting-app-${{ inputs.service }}:latest

      
